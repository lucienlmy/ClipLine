# Replace a release's notes with RELEASE_NOTES.md (no rebuild).
name: Release notes

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.3.0"
        required: true

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ inputs.tag }}" --notes-file RELEASE_NOTES.md --repo "${{ github.repository }}"
