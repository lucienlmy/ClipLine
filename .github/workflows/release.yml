# Build ClipLine on GitHub's Windows runners and attach the binaries to a
# DRAFT release. Trigger: push a tag like v1.1.0, or run manually from the
# Actions tab (Run workflow) — the tag is then created from the version. The draft is only visible to the repo owner until published.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a draft release (tag = v + version in tauri.conf.json)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build (portable exe + NSIS installer)
        working-directory: src-tauri
        run: tauri build

      - name: Collect artifacts
        shell: pwsh
        run: |
          $ver = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src-tauri/target/release/clipline.exe "dist/ClipLine_${ver}_portable_x64.exe"
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object {
            Copy-Item $_.FullName "dist/$($_.Name)"
          }
          Get-ChildItem dist
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: ClipLine-windows
          path: dist/*.exe

      - name: Draft GitHub release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: ClipLine v${{ env.VERSION }}
          files: dist/*.exe
          body: |
            ClipLine v${{ env.VERSION }} for Windows 10/11 (x64).

            - `ClipLine_*_portable_x64.exe` — 免安装便携版，双击即用
            - `ClipLine_*_x64-setup.exe` — 安装版

            需要系统自带的 WebView2（Windows 10/11 通常已内置）。
            使用说明见仓库中的 `使用说明.md`。
