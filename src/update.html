<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>ClipLine 更新</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; user-select: none; -webkit-user-select: none; }
  #card { position: absolute; inset: 8px; border-radius: 14px; background: #fffdf7; color: #2b2a27;
    box-shadow: 0 10px 28px rgba(0,0,0,0.28), 0 0 0 1px rgba(0,0,0,0.06); padding: 16px 16px 12px; display: flex; flex-direction: column;
    animation: swing 0.9s cubic-bezier(.3,1.4,.5,1) both; transform-origin: 50% -30px; }
  @keyframes swing { 0% { transform: translateY(-30px) rotate(-6deg); opacity: 0; } 40% { opacity: 1; } 60% { transform: rotate(3deg); } 100% { transform: none; } }
  #peg { position: absolute; top: -2px; left: 50%; width: 12px; height: 24px; margin-left: -6px; border-radius: 5px; background: linear-gradient(#e6a985, #d97757); }
  #drag { position: absolute; inset: 0 40px auto 0; height: 34px; -webkit-app-region: drag; }
  #x { position: absolute; top: 8px; right: 10px; width: 22px; height: 22px; padding: 0; border-radius: 50%; background: transparent; font-size: 12px; opacity: 0.55; }
  #x:hover { opacity: 1; background: rgba(0,0,0,0.08); }
  .kicker { font-size: 12px; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
  #title { font-size: 16px; font-weight: 650; margin: 6px 0 2px; }
  #sub { font-size: 12px; opacity: 0.7; line-height: 1.5; }
  #mid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #notes { flex: 1; min-height: 0; overflow-y: auto; margin-top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,0.035);
    font-size: 12px; line-height: 1.6; user-select: text; -webkit-user-select: text; }
  #notes h4 { margin: 8px 0 2px; font-size: 12.5px; }
  #notes h4:first-child { margin-top: 0; }
  #notes ul { margin: 2px 0; padding-left: 16px; }
  #notes code { font-family: Consolas, monospace; font-size: 11px; background: rgba(0,0,0,0.06); padding: 0 3px; border-radius: 3px; }
  #notes p { margin: 3px 0; }
  .spacer { flex: 1; }
  #bar { height: 8px; border-radius: 99px; background: rgba(0,0,0,0.08); overflow: hidden; margin-top: 14px; }
  #fill { height: 100%; width: 0; background: #d97757; border-radius: 99px; transition: width 0.2s; }
  #bar.indet #fill { width: 35%; animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(290%); } }
  .row { display: flex; gap: 6px; margin-top: 10px; align-items: center; }
  button { border: none; border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; background: rgba(0,0,0,0.07); color: inherit; white-space: nowrap; }
  button:hover { background: rgba(0,0,0,0.13); }
  button.primary { background: #d97757; color: #fff; }
  button.primary:hover { background: #c96646; }
  button.link { background: transparent; padding: 6px 4px; opacity: 0.7; text-decoration: underline; }
  .push { margin-left: auto; }
  .err { color: #b2442a; }
  .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid rgba(0,0,0,0.15); border-top-color: #d97757; border-radius: 50%; animation: rot 0.8s linear infinite; }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="card">
    <i id="peg"></i>
    <div id="drag"></div>
    <button id="x">✕</button>
    <div class="kicker"><span id="icon">⬆</span><span id="kick"></span></div>
    <div id="title"></div>
    <div id="sub"></div>
    <div id="mid"></div>
    <div class="row" id="btns"></div>
  </div>
<script>
  const T = window.__TAURI__;
  const invoke = T.core.invoke;
  const $ = (id) => document.getElementById(id);
  const win = T.window.getCurrentWindow();
  let mode = "notify";
  const L = {
    zh: {
      doc: "ClipLine 更新", kick: "ClipLine 更新", close: "关闭", installer: "安装版", portable: "便携版",
      checking: "正在检查更新…", connecting: "正在连接 GitHub",
      uptodate: "已是最新版本", uptodateSub: "当前 v{cur}（{kind}），GitHub 上最新为 v{latest}", releasePage: "查看发布页", ok: "好的",
      found: "发现新版本 v{v}", current: "当前 v{v}", noNotes: "（这个版本没有写更新说明）",
      skip: "跳过此版本", later: "以后再说", updateNow: "立即更新",
      downloading: "正在下载 v{v}", downloadingDots: "正在下载…", background: "后台下载",
      ready: "v{v} 已下载好", readyInst: "将以免打扰方式安装，完成后自动重新打开。",
      readyPort: "将直接替换当前程序文件（文件名和位置不变），然后自动重新打开。", readyAuto: "选「稍后」的话，退出 ClipLine 时会自动安装。",
      laterBtn: "稍后", restart: "重启并更新", installing: "正在更新…", installingSub: "ClipLine 会自动关闭并重新打开",
      failed: "更新没有成功", unknown: "未知错误", manual: "打开发布页手动下载", retry: "重试",
    },
    en: {
      doc: "ClipLine update", kick: "ClipLine update", close: "Close", installer: "installer", portable: "portable",
      checking: "Checking for updates…", connecting: "Connecting to GitHub",
      uptodate: "You're up to date", uptodateSub: "This is v{cur} ({kind}); the latest on GitHub is v{latest}", releasePage: "Release page", ok: "OK",
      found: "New version v{v} available", current: "Current v{v}", noNotes: "(No release notes for this version)",
      skip: "Skip this version", later: "Not now", updateNow: "Update now",
      downloading: "Downloading v{v}", downloadingDots: "Downloading…", background: "Hide",
      ready: "v{v} is ready", readyInst: "It installs quietly and reopens ClipLine when done.",
      readyPort: "It replaces this program file in place (same name and folder), then reopens ClipLine.", readyAuto: " If you choose Later, it installs when you quit ClipLine.",
      laterBtn: "Later", restart: "Restart & update", installing: "Updating…", installingSub: "ClipLine will close and reopen by itself",
      failed: "The update didn't go through", unknown: "Unknown error", manual: "Download from the release page", retry: "Retry",
    },
  };
  let lang = "zh";
  const tr = (k, vars) => { let v = (L[lang] && L[lang][k]) || L.zh[k] || k; for (const n in vars || {}) v = v.split("{" + n + "}").join(vars[n]); return v; };
  // Errors come from the Rust side in Chinese; translate the known ones.
  const ERR_EN = [
    [/^无法连接 GitHub：/, "Couldn't reach GitHub: "],
    [/^GitHub 返回的内容无法识别$/, "GitHub sent back something unrecognisable"],
    [/^没有找到已发布的版本$/, "No published release was found"],
    [/^检查过于频繁.*$/, "Too many checks — GitHub is refusing for now; please try again later"],
    [/^这个版本没有找到可用的安装文件.*$/, "This release has no usable download; please get it from the release page"],
    [/^正在下载中$/, "Already downloading"],
    [/^下载失败：/, "Download failed: "],
    [/^下载的文件不完整.*$/, "The download is incomplete; please retry"],
    [/^下载的文件无效.*$/, "The downloaded file is invalid; please retry"],
    [/^还没有下载更新$/, "The update hasn't been downloaded yet"],
    [/^更新文件不见了.*$/, "The update file is gone; please download it again"],
    [/^无法启动安装程序：/, "Couldn't start the installer: "],
    [/^无法写入程序所在的文件夹（(.*)），请到发布页手动下载$/, "Can't write to ClipLine's folder ($1); please download from the release page"],
    [/^无法替换程序文件：/, "Couldn't replace the program file: "],
    [/^新版本已就位，但没能自动启动：/, "The new version is in place but didn't start: "],
    [/错误代码 /g, "error code "],
    [/^没有收到文件$/, "No file was received"],
    [/^仅支持 Windows$/, "Windows only"],
  ];
  const errText = (e) => { if (!e) return tr("unknown"); if (lang !== "en") return e; let s = e; ERR_EN.forEach(([re, to]) => { s = s.replace(re, to); }); return s; };
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = tr("doc"); $("kick").textContent = tr("kick"); $("x").title = tr("close");
  }
  let st = { phase: "idle" };

  const close = () => { try { win.close(); } catch (e) {} };
  const mb = (n) => (n / 1048576).toFixed(1) + " MB";
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // Release notes are Markdown; show the part from the first heading on
  // (the file list above it is not interesting here).
  function md(src) {
    let lines = (src || "").replace(/\r/g, "").split("\n");
    const h = lines.findIndex((l) => /^#{2,4}\s/.test(l));
    if (h > 0) lines = lines.slice(h);
    let out = "", inList = false;
    const inline = (t) => esc(t).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
    for (const raw of lines) {
      const l = raw.trimEnd();
      const li = l.match(/^\s*[-*]\s+(.*)$/);
      if (li) { if (!inList) { out += "<ul>"; inList = true; } out += "<li>" + inline(li[1]) + "</li>"; continue; }
      if (inList) { out += "</ul>"; inList = false; }
      const hd = l.match(/^#{1,6}\s+(.*)$/);
      if (hd) out += "<h4>" + inline(hd[1]) + "</h4>";
      else if (l.trim()) out += "<p>" + inline(l) + "</p>";
    }
    if (inList) out += "</ul>";
    return out || "<p>" + esc(tr("noNotes")) + "</p>";
  }

  function btn(label, fn, cls) {
    const b = document.createElement("button");
    b.textContent = label; if (cls) b.className = cls; b.onclick = fn;
    $("btns").appendChild(b); return b;
  }

  function render() {
    const i = st.info || {};
    const kind = i.kind === "installer" ? tr("installer") : tr("portable");
    $("btns").innerHTML = "";
    $("icon").textContent = "⬆";
    $("sub").classList.remove("err");
    const mid = $("mid"); mid.innerHTML = "";

    switch (st.phase) {
      case "checking":
      case "idle":
        $("icon").innerHTML = '<span class="spin"></span>';
        $("title").textContent = tr("checking");
        $("sub").textContent = tr("connecting");
        btn(tr("close"), close, "push");
        break;
      case "uptodate":
        $("icon").textContent = "✓";
        $("title").textContent = tr("uptodate");
        $("sub").textContent = tr("uptodateSub", { cur: i.current || "", kind, latest: i.latest || "" });
        btn(tr("releasePage"), () => invoke("open_release_page"), "link");
        btn(tr("ok"), close, "primary push");
        break;
      case "available": {
        $("title").textContent = tr("found", { v: i.latest });
        $("sub").textContent = tr("current", { v: i.current }) + ` · ${kind}` + (i.size ? ` · ${mb(i.size)}` : "");
        const notes = document.createElement("div"); notes.id = "notes"; notes.innerHTML = md(i.notes);
        mid.appendChild(notes);
        btn(tr("skip"), () => invoke("skip_update", { version: i.latest }).catch(() => close()), "link");
        btn(tr("later"), close, "push");
        btn(tr("updateNow"), () => invoke("download_update"), "primary");
        break;
      }
      case "downloading": {
        $("title").textContent = tr("downloading", { v: i.latest });
        const pct = st.total ? Math.min(100, Math.round((st.done / st.total) * 100)) : 0;
        $("sub").textContent = st.total ? `${mb(st.done)} / ${mb(st.total)} (${pct}%)` : tr("downloadingDots");
        const bar = document.createElement("div"); bar.id = "bar"; if (!st.total) bar.className = "indet";
        const fill = document.createElement("div"); fill.id = "fill"; if (st.total) fill.style.width = pct + "%";
        bar.appendChild(fill); mid.appendChild(bar);
        btn(tr("background"), close, "push");
        break;
      }
      case "ready":
        $("icon").textContent = "✓";
        $("title").textContent = tr("ready", { v: i.latest });
        $("sub").textContent = (i.kind === "installer" ? tr("readyInst") : tr("readyPort")) + (mode === "auto" ? tr("readyAuto") : "");
        btn(tr("laterBtn"), close, "push");
        btn(tr("restart"), () => invoke("install_update").catch(() => {}), "primary");
        break;
      case "installing":
        $("icon").innerHTML = '<span class="spin"></span>';
        $("title").textContent = tr("installing");
        $("sub").textContent = tr("installingSub");
        break;
      case "error":
      default:
        $("icon").textContent = "!";
        $("title").textContent = tr("failed");
        $("sub").textContent = errText(st.error);
        $("sub").classList.add("err");
        btn(tr("manual"), () => invoke("open_release_page"), "link");
        btn(tr("close"), close, "push");
        btn(tr("retry"), () => (st.info && st.info.newer ? invoke("download_update") : invoke("check_update")), "primary");
        break;
    }
  }

  $("x").onclick = close;
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  T.event.listen("update:status", (e) => { st = e.payload || st; render(); });
  (async () => {
    try {
      const s = JSON.parse(await invoke("get_settings")); mode = s.update_mode || "notify";
      lang = (s.lang === "auto" ? s.sys_lang : s.lang) === "en" ? "en" : "zh";
    } catch (e) {}
    applyLang();
    try { st = (await invoke("update_status")) || st; } catch (e) {}
    render();
  })();
</script>
</body>
</html>
