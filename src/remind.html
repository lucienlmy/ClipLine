<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>ClipLine 提醒</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; user-select: none; -webkit-user-select: none; }
  #card { position: absolute; inset: 8px; border-radius: 14px; background: var(--bg, #fffdf7); color: var(--ink, #2b2a27);
    box-shadow: 0 10px 28px rgba(0,0,0,0.28), 0 0 0 1px rgba(0,0,0,0.06); padding: 14px 16px 12px; display: flex; flex-direction: column;
    animation: swing 0.9s cubic-bezier(.3,1.4,.5,1) both; transform-origin: 50% -30px; }
  @keyframes swing { 0% { transform: translateY(-30px) rotate(-6deg); opacity: 0; } 40% { opacity: 1; } 60% { transform: rotate(3deg); } 100% { transform: none; } }
  #peg { position: absolute; top: -2px; left: 50%; width: 12px; height: 24px; margin-left: -6px; border-radius: 5px; background: linear-gradient(#e6a985, #d97757); }
  .when { font-size: 12px; opacity: 0.75; display: flex; align-items: center; gap: 6px; }
  .bell { display: inline-block; animation: ring 1.2s ease 0.3s 2; transform-origin: 50% 0; }
  @keyframes ring { 0%,100% { transform: rotate(0); } 15% { transform: rotate(16deg); } 30% { transform: rotate(-14deg); } 45% { transform: rotate(10deg); } 60% { transform: rotate(-6deg); } 75% { transform: rotate(3deg); } }
  #title { font-size: 16px; font-weight: 650; margin: 8px 0 4px; word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #body { font-size: 12.5px; line-height: 1.55; opacity: 0.88; flex: 1; min-height: 0; overflow-y: auto; word-break: break-word; user-select: text; -webkit-user-select: text; }
  #body::-webkit-scrollbar { width: 5px; } #body::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 9px; }
  /* Markdown (shared with the note cards; keep in step with styles.css) */
  .md-h { font-weight: 650; margin: 2px 0; } .md-h1 { font-size: 1.15em; } .md-h2 { font-size: 1.08em; }
  .md-li { display: flex; gap: 6px; align-items: flex-start; }
  .md-dot, .md-num { flex: none; opacity: 0.7; min-width: 8px; }
  .md-task .box { width: 13px; height: 13px; border: 1.5px solid currentColor; border-radius: 4px; flex: none; margin-top: 2px; opacity: 0.7; font-size: 10px; text-align: center; line-height: 12px; cursor: pointer; }
  .md-task .box:hover { opacity: 1; }
  .md-task.done .md-tx { opacity: 0.55; text-decoration: line-through; }
  .md-quote { border-left: 3px solid rgba(0,0,0,0.18); padding-left: 8px; opacity: 0.85; }
  .md-hr { border-top: 1px solid rgba(0,0,0,0.15); margin: 5px 0; }
  .md-gap { height: 5px; }
  .md-pre { margin: 3px 0; padding: 5px 7px; border-radius: 6px; background: rgba(0,0,0,0.06); font: 11px/1.45 Consolas, monospace; white-space: pre-wrap; }
  code { font: 0.92em Consolas, monospace; background: rgba(0,0,0,0.07); padding: 0 3px; border-radius: 3px; }
  a.md-a { color: #c0613f; text-decoration: underline; cursor: pointer; }
  .row { display: flex; gap: 6px; margin-top: 8px; }
  button { border: none; border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; background: rgba(0,0,0,0.07); color: inherit; white-space: nowrap; }
  button:hover { background: rgba(0,0,0,0.13); }
  button.primary { background: #d97757; color: #fff; margin-left: auto; }
  #x { position: absolute; top: 8px; right: 10px; width: 22px; height: 22px; padding: 0; border-radius: 50%; background: transparent; font-size: 12px; opacity: 0.55; }
  #x:hover { opacity: 1; background: rgba(0,0,0,0.08); }
</style>
</head>
<body>
  <div id="card">
    <i id="peg"></i>
    <button id="x">✕</button>
    <div class="when"><span class="bell">🔔</span><span id="when"></span></div>
    <div id="title"></div>
    <div id="body"></div>
    <div class="row">
      <button id="snooze"></button>
      <button id="open"></button>
      <button id="ack" class="primary"></button>
    </div>
  </div>
<script src="md.js"></script>
<script>
  const T = window.__TAURI__;
  const invoke = T.core.invoke;
  const $ = (id) => document.getElementById(id);
  let label = "", data = {};
  const L = {
    zh: { title: "ClipLine 提醒", remind: "提醒", snooze: "10 分钟后再提醒", open: "打开便签", ack: "知道了" },
    en: { title: "ClipLine reminder", remind: "Reminder", snooze: "Snooze 10 min", open: "Open note", ack: "Got it" },
  };
  let tr = L.zh;
  function applyLang(lang) {
    tr = L[lang === "en" ? "en" : "zh"];
    document.documentElement.lang = lang === "en" ? "en" : "zh";
    document.title = tr.title;
    $("snooze").textContent = tr.snooze; $("open").textContent = tr.open;
    $("ack").textContent = tr.ack; $("x").title = tr.ack;
  }
  applyLang("zh");
  try { label = T.window.getCurrentWindow().label; } catch (e) {}

  // a soft two-note chime (no sound file needed)
  function chime() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [[880, 0], [1318.5, 0.18]].forEach(([f, t0]) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, ac.currentTime + t0);
        g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + t0 + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t0 + 0.9);
        o.connect(g).connect(ac.destination); o.start(ac.currentTime + t0); o.stop(ac.currentTime + t0 + 1);
      });
    } catch (e) {}
  }

  (async () => {
    try { data = (await invoke("get_reminder", { label })) || {}; } catch (e) {}
    const card = $("card");
    if (data.bg) card.style.setProperty("--bg", data.bg);
    if (data.ink) card.style.setProperty("--ink", data.ink);
    let lang = data.lang;
    if (!lang) { try { const c = JSON.parse(await invoke("get_settings")); lang = c.lang === "auto" ? c.sys_lang : c.lang; } catch (e) {} }
    applyLang(lang);
    $("when").textContent = data.when || "";
    $("title").innerHTML = data.title ? MD.inline(data.title) : MD.esc(tr.remind);
    drawBody();
    if (data.sound !== false) chime();
  })();

  // The body is the whole note from line `from` on, so each to-do box's
  // data-idx is the note's own line number. Ticking here updates the note in
  // the main window (remind:toggle) and redraws the card in place.
  function drawBody() {
    const el = $("body"), top = el.scrollTop;
    el.innerHTML = MD.render(data.body || "", { from: data.from || 0 });
    el.querySelectorAll("a.md-a").forEach((a) => a.addEventListener("click", (e) => {
      e.preventDefault();
      const u = a.dataset.href || ""; invoke("open_url", { url: /^https?:\/\//i.test(u) ? u : "http://" + u }).catch(() => {});
    }));
    el.querySelectorAll(".box").forEach((b) => b.addEventListener("click", () => {
      const idx = parseInt(b.dataset.idx, 10);
      const line = String(data.body || "").split("\n")[idx];
      const nb = MD.toggle(data.body || "", idx);
      if (nb === data.body) return;
      data.body = nb;
      try { T.event.emit("remind:toggle", { id: data.id || "", idx, line }).catch(() => {}); } catch (e) {}
      drawBody();
    }));
    el.scrollTop = top;
  }

  const act = (a) => invoke("reminder_action", { label, id: data.id || "", action: a }).catch(() => {});
  $("ack").onclick = () => act("ack");
  $("x").onclick = () => act("ack");
  $("snooze").onclick = () => act("snooze");
  $("open").onclick = () => act("open");
</script>
</body>
</html>
