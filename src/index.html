<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClipLine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="stage" class="up deck-clipboard">
    <div id="panel">
      <div id="catchZone"></div>
      <svg id="rope" preserveAspectRatio="none">
        <path id="ropePath" d="" />
      </svg>

      <button id="plus" title="新建便签">+</button>
      <button id="basket" title="收纳袋：已完成的便签"><svg viewBox="0 0 110 150" width="143" height="195" aria-hidden="true">
        <defs>
          <linearGradient id="bkWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dcc9a6"/><stop offset="1" stop-color="#b3946a"/></linearGradient>
          <linearGradient id="bkCloth" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--bag-a)"/><stop offset="1" stop-color="var(--bag-b)"/></linearGradient>
          <pattern id="bkWeave" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 2h4M2 0v4" stroke="rgba(120,95,60,0.045)" stroke-width="1"/></pattern>
        </defs>
        <path d="M55 22 V10 a6 6 0 1 1 6 -6" fill="none" stroke="#8d8a84" stroke-width="2.4" stroke-linecap="round"/>
        <path d="M55 21 L16 33 M55 21 L94 33" stroke="#8d8a84" stroke-width="2" stroke-linecap="round"/>
        <rect x="10" y="30" width="90" height="8" rx="4" fill="url(#bkWood)"/>
        <path d="M16 37 H94 Q99 37 99 44 V118 Q99 145 55 145 Q11 145 11 118 V44 Q11 37 16 37 Z" fill="url(#bkCloth)"/>
        <path d="M16 37 H94 Q99 37 99 44 V118 Q99 145 55 145 Q11 145 11 118 V44 Q11 37 16 37 Z" fill="url(#bkWeave)"/>
        <path d="M18 42 H92 Q94.5 42 94.5 46 V117 Q94.5 140 55 140 Q15.5 140 15.5 117 V46 Q15.5 42 18 42 Z" fill="none" stroke="var(--bag-stitch)" stroke-width="1.2" stroke-dasharray="3 2.4"/>
        <ellipse cx="55" cy="64" rx="27" ry="10" fill="var(--bag-in)"/>
        <g class="bk-paper"><rect x="40" y="44" width="25" height="26" rx="2" transform="rotate(-9 52 57)" fill="#f7f1e2" stroke="#d9cdb4" stroke-width="0.8"/>
          <path d="M43 52h14M43 57h17M43 62h11" stroke="#cbbd9f" stroke-width="1.3" stroke-linecap="round" transform="rotate(-9 52 57)"/>
          <rect x="54" y="47" width="20" height="22" rx="2" transform="rotate(11 64 58)" fill="#e6eef0" stroke="#c3d1d6" stroke-width="0.8"/></g>
        <path d="M28 64 A27 10 0 0 0 82 64 Q82 70 76 72 Q55 79 34 72 Q28 70 28 64 Z" fill="url(#bkCloth)"/>
        <path d="M28 64 A27 10 0 0 0 82 64" fill="none" stroke="var(--bag-stitch)" stroke-width="1.4"/>
        <rect x="31" y="90" width="48" height="36" rx="5" fill="var(--bag-patch)" stroke="var(--bag-stitch)" stroke-width="1" stroke-dasharray="2.6 2"/>
      </svg><span class="bk-label"><b class="bk-n">0</b><i class="bk-cap"></i></span></button>

      <div id="line">
        <div id="cards"></div>
      </div>

      <div id="pill">
        <button class="nav" id="prev" title="上一屏">‹</button>
        <div class="filters" id="filters"></div>
        <div class="search">
          <input id="searchInput" type="text" placeholder="搜索…" spellcheck="false" />
        </div>
        <button class="pillbtn" id="shotBtn" title="截图上绳">✂ 截图</button>
        <button class="pillbtn" id="tidy" hidden title="取下原文件已不在的卡片">整理</button>
        <button class="pillbtn" id="foldBtn" hidden title="按日期折叠">🗂</button>
        <button class="pinOnly" id="pinOnly" title="只看收藏">★</button>
        <span class="count" id="count"></span>
        <button class="nav" id="next" title="下一屏">›</button>
        <button class="gear" id="gear" title="设置">⚙</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Note editor -->
  <div id="editor" hidden>
    <div class="editor-sheet">
      <div class="editor-head">
        <div class="tints" id="tints"></div>
        <button class="editor-close" id="editorClose" title="保存并关闭 (Esc)">✕</button>
      </div>
      <div class="editor-tools" id="edTools"></div>
      <textarea id="editorBody" placeholder="写点什么…"></textarea>
      <div id="editorPreview" class="md" hidden></div>
      <div class="link-note" id="linkNoteRow" hidden>
        <label for="linkNote" id="linkNoteLab">备注</label>
        <input id="linkNote" type="text" maxlength="100" spellcheck="false" />
        <span class="cnt" id="linkNoteCnt">0/100</span>
      </div>
      <div class="editor-foot">
        <button id="bell" title="提醒">🔔 <span id="bellText">提醒</span></button>
        <span class="hint">Ctrl+S 保存 · Esc 关闭</span>
        <button id="editorSave" class="primary">保存</button>
      </div>
    </div>
  </div>

  <!-- Stack popover: the files inside a multi-file card -->
  <div id="stackPop" hidden>
    <div class="sp-head"><span id="spTitle"></span><button id="spSplit"></button><button id="spClose">✕</button></div>
    <div class="sp-hint" id="spHint"></div>
    <div id="spItems"></div>
  </div>

  <!-- Preview overlay -->
  <div id="preview" hidden>
    <div class="preview-inner" id="previewInner"></div>
  </div>

  <!-- Reading view: a note in full (tick boxes, open links; no editing) -->
  <div id="reader" hidden>
    <div class="reader-sheet" id="readerSheet">
      <div class="reader-head">
        <div class="reader-title" id="readerTitle"></div>
        <span class="note-prog" id="readerProg" hidden></span>
        <button class="reader-edit" id="readerEdit">✎ 编辑</button>
        <button class="editor-close" id="readerClose" title="关闭">✕</button>
      </div>
      <div class="reader-body md" id="readerBody"></div>
      <div class="reader-foot" id="readerHint"></div>
    </div>
  </div>

  <!-- Basket: finished notes, counted by month -->
  <div id="basketView" hidden>
    <div class="bk-sheet">
      <div class="bk-head">
        <div class="bk-title" id="bkTitle"></div>
        <button class="bk-clear" id="bkClear"></button>
        <button class="editor-close" id="bkClose">✕</button>
      </div>
      <div class="bk-stat" id="bkStat"></div>
      <div class="bk-body" id="bkBody"></div>
      <div class="bk-foot" id="bkKeep"></div>
    </div>
  </div>

  <!-- Manage note categories -->
  <div id="catPop" hidden>
    <div class="cat-sheet">
      <div class="bk-head"><div class="bk-title" id="catTitle"></div><button class="editor-close" id="catClose">✕</button></div>
      <div id="catList"></div>
      <div class="cat-add" id="catAddRow"><span class="cat-dots" id="catAddDots"></span><input id="catNewName" type="text" maxlength="12" spellcheck="false"><button id="catAddBtn"></button></div>
      <div class="cat-full" id="catFull" hidden></div>
      <div class="bk-foot" id="catHint"></div>
    </div>
  </div>

  <!-- Context menu -->
  <div id="ctx" hidden></div>

  <!-- Settings -->
  <div id="settings" hidden>
    <div class="settings-sheet">
      <div class="settings-head">
        <h2 id="setTitle">设置</h2>
        <button class="editor-close" id="setClose" title="关闭">✕</button>
      </div>
      <div class="settings-body" id="settingsBody"></div>
    </div>
  </div>

  <script src="md.js"></script>
  <script src="app.js"></script>
</body>
</html>
