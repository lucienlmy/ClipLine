<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>ClipLine 设置</title>
<link rel="stylesheet" href="styles.css" />
<style>
  html, body { background: #fffdf9; height: 100%; }
  #swrap { display: flex; flex-direction: column; height: 100vh; }
  #smain { flex: 1; display: flex; min-height: 0; }
  #snav { width: 168px; flex: none; padding: 14px 10px; background: rgba(0,0,0,0.025); border-right: 1px solid rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  .snav-title { font-size: 16px; font-weight: 650; padding: 2px 10px 12px; }
  .snav-item { display: flex; align-items: center; gap: 9px; border: none; background: transparent; text-align: left; font-size: 13px; color: var(--ink); padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .snav-item i { font-style: normal; width: 18px; text-align: center; font-size: 13px; opacity: 0.85; }
  .snav-item:hover { background: rgba(0,0,0,0.05); }
  .snav-item.on { background: rgba(var(--clay-rgb),0.13); color: var(--clay); font-weight: 600; }
  #sbody { flex: 1; overflow-y: auto; padding: 6px 24px 16px; -webkit-user-select: text; user-select: text; }
  .set-row > div:first-child { flex: 1; min-width: 0; }
  .set-row > .seg, .set-row > .switch, .set-row > .hk-input, .set-row > .btn-mini { flex: none; }
  .set-row > .seg { flex-wrap: nowrap !important; }
  .set-section > .sub { font-size: 11.5px; color: var(--ink-soft); }
  .theme-grid { grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .spage-title { font-size: 17px; font-weight: 650; margin: 14px 0 0; }
  #sfoot { display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px 20px; border-top: 1px solid rgba(0,0,0,0.07); }
  #sfoot .set-err { flex: 1; margin: 0; font-size: 12px; color: #c0392b; }
  #sfoot button { border: none; border-radius: 999px; padding: 8px 18px; font-size: 13px; cursor: pointer; background: rgba(0,0,0,0.06); }
  #sfoot button.primary { background: var(--clay); color: #fff; }
  /* update history panel */
  #history { position: fixed; inset: 0; background: #fffdf9; display: flex; flex-direction: column; z-index: 50; }
  #history[hidden] { display: none; }
  #historyHead { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid rgba(0,0,0,0.07); }
  #historyHead b { font-size: 16px; font-weight: 650; }
  #historyBack { border: none; background: rgba(0,0,0,0.06); border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; }
  #historyBack:hover { background: rgba(0,0,0,0.12); }
  #historyList { flex: 1; overflow-y: auto; padding: 6px 20px 20px; -webkit-user-select: text; user-select: text; }
  .hist-rel { padding: 12px 0; border-bottom: 1px solid rgba(0,0,0,0.06); }
  .hist-rel:last-child { border-bottom: none; }
  .hist-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
  .hist-head b { font-size: 15px; }
  .hist-date { font-size: 12px; color: var(--ink-soft); }
  .hist-cur { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: rgba(var(--clay-rgb),0.14); color: var(--clay); }
  .hist-body { font-size: 13px; line-height: 1.65; }
  .hist-body .md-h { margin: 8px 0 2px; font-size: 13.5px; }
</style>
</head>
<body>
  <div id="swrap">
    <div id="smain"><nav id="snav"></nav><div id="sbody"></div></div>
    <div id="sfoot">
      <div class="set-err" id="setErr"></div>
      <button id="cancelBtn">取消</button>
      <button id="saveBtn" class="primary">保存</button>
    </div>
  </div>
  <div id="history" hidden>
    <div id="historyHead"><button id="historyBack">‹</button><b id="historyTitle"></b></div>
    <div id="historyList"></div>
  </div>
  <script src="md.js"></script>
  <script src="settings.js"></script>
</body>
</html>
