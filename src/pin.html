<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>ClipLine Pin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  #frame {
    position: relative; width: 100%; height: 100%;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 16px 44px rgba(0,0,0,0.45);
    background: #fff; border: 1px solid rgba(0,0,0,0.14);
  }
  #img { width: 100%; height: 100%; object-fit: contain; display: block; background: #f3f1ec; }
  /* pushpin, drawn over the top-center of the photo */
  #pin { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); width: 34px; height: 40px; z-index: 3; pointer-events: none; filter: drop-shadow(0 3px 3px rgba(0,0,0,0.35)); }
  #close {
    position: absolute; top: 6px; right: 8px; z-index: 4;
    width: 22px; height: 22px; border: none; border-radius: 50%;
    background: rgba(0,0,0,0.42); color: #fff; font-size: 12px; line-height: 1; cursor: pointer;
    opacity: 0; transition: opacity 0.12s;
  }
  #frame:hover #close { opacity: 1; }
  #close:hover { background: #e9573f; }
  #hint { position: absolute; bottom: 6px; right: 8px; z-index: 3; font-size: 10px; color: #fff; background: rgba(0,0,0,0.35); padding: 1px 7px; border-radius: 6px; opacity: 0; transition: opacity 0.12s; }
  #frame:hover #hint { opacity: 1; }
</style>
</head>
<body>
  <div id="frame" data-tauri-drag-region>
    <img id="img" alt="" draggable="false" data-tauri-drag-region />
    <svg id="pin" viewBox="0 0 34 40" xmlns="http://www.w3.org/2000/svg">
      <rect x="15.2" y="18" width="3.6" height="20" rx="1.8" fill="#8a8f98"/>
      <ellipse cx="17" cy="11" rx="12" ry="10" fill="#e9573f"/>
      <ellipse cx="13" cy="7.5" rx="3.6" ry="2.6" fill="#ff9b86" opacity="0.9"/>
      <ellipse cx="17" cy="18" rx="7" ry="2.4" fill="#c0392b"/>
    </svg>
    <button id="close" title="关闭 (Esc)">✕</button>
    <div id="hint">滚轮缩放 · 可拖动</div>
  </div>
<script>
  const T = window.__TAURI__;
  const { getCurrentWindow, LogicalSize } = T.window;
  const params = new URLSearchParams(location.search);
  const path = decodeURIComponent(params.get("path") || "");
  const img = document.getElementById("img");
  const BAR = 0; // image fills; pushpin floats over it

  let natW = 480, natH = 360, scale = 1, screenW = 1920, screenH = 1080;

  function applySize() {
    const w = Math.max(160, Math.round(natW * scale));
    const h = Math.max(120, Math.round(natH * scale));
    try { getCurrentWindow().setSize(new LogicalSize(w, h + BAR)); } catch (e) {}
  }

  img.onload = () => {
    natW = img.naturalWidth || natW;
    natH = img.naturalHeight || natH;
    // Fit within ~78% of a typical work area on first show.
    const capW = 900, capH = 680;
    scale = Math.min(1, capW / natW, capH / natH);
    applySize();
  };

  (async () => {
    try { img.src = await T.core.invoke("read_image_data", { path }); }
    catch (e) { try { img.src = T.core.convertFileSrc(path); } catch (err) { img.src = path; } }
  })();

  function closeSelf() { try { getCurrentWindow().close(); } catch (e) { window.close(); } }
  document.getElementById("close").addEventListener("click", (e) => { e.stopPropagation(); closeSelf(); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSelf(); });

  window.addEventListener("wheel", (e) => {
    e.preventDefault();
    scale *= e.deltaY < 0 ? 1.12 : 1 / 1.12;
    scale = Math.max(0.15, Math.min(6, scale));
    applySize();
  }, { passive: false });
</script>
</body>
</html>
