<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<title>ClipLine Pin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: "Segoe UI","Microsoft YaHei",sans-serif; }
  body { padding: 18px 6px 8px 6px; }
  #frame {
    position: relative; width: 100%; height: 100%;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 16px 44px rgba(0,0,0,0.45);
    background: #fff; border: 1px solid rgba(0,0,0,0.14);
  }
  #img { width: 100%; height: 100%; object-fit: contain; display: block; background: #f3f1ec; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px; text-align: center; font-size: 12px; color: #c0392b; word-break: break-all; }
  #pin { position: fixed; top: 0; left: 50%; transform: translateX(-50%); width: 36px; height: 44px; z-index: 5; pointer-events: none;
    --pin-base: #e2604a; --pin-hi: #f6b3a6; --pin-dk: #a93b2a; filter: drop-shadow(0 2px 2px rgba(0,0,0,0.25)); }
  #close { position: absolute; top: 6px; right: 8px; z-index: 4; width: 22px; height: 22px; border: none; border-radius: 50%; background: rgba(0,0,0,0.42); color: #fff; font-size: 12px; line-height: 1; cursor: pointer; opacity: 0; transition: opacity 0.12s; }
  #frame:hover #close { opacity: 1; }
  .pbtn { position: absolute; top: 6px; z-index: 4; height: 22px; border: none; border-radius: 11px; background: rgba(0,0,0,0.42); color: #fff;
    font-size: 11px; padding: 0 8px; cursor: pointer; opacity: 0; transition: opacity 0.12s; }
  #frame:hover .pbtn { opacity: 1; }
  .pbtn:hover { background: rgba(0,0,0,0.65); }
  #annBtn { left: 8px; } #ocrBtn { left: 62px; } #topBtn { left: 116px; }
  #topBtn.on { background: rgba(217,119,87,0.9); }
  #close:hover { background: #e9573f; }
  #hint { position: absolute; bottom: 6px; right: 8px; z-index: 3; font-size: 10px; color: #fff; background: rgba(0,0,0,0.35); padding: 1px 7px; border-radius: 6px; opacity: 0; transition: opacity 0.12s; }
  #frame:hover #hint { opacity: 1; }
</style>
</head>
<body data-tauri-drag-region>
  <div id="frame" data-tauri-drag-region>
    <img id="img" alt="" draggable="false" data-tauri-drag-region />
    <div id="err"></div>
    <svg id="pin" viewBox="0 0 40 48" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0.8">
          <stop offset="0" style="stop-color:var(--pin-hi)"/>
          <stop offset="0.55" style="stop-color:var(--pin-base)"/>
          <stop offset="1" style="stop-color:var(--pin-dk)"/>
        </linearGradient>
        <linearGradient id="ng" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#eef2f6"/><stop offset="1" stop-color="#76838f"/>
        </linearGradient>
      </defs>
      <ellipse cx="22" cy="44.6" rx="7.5" ry="2.2" fill="rgba(20,24,30,0.22)"/>
      <g transform="rotate(-12 20 34)">
        <path d="M19.2,28 L19.75,43.4 Q20,45 20.25,43.4 L20.8,28 Z" fill="url(#ng)"/>
        <ellipse cx="20" cy="27" rx="10.5" ry="3.8" fill="url(#pg)" style="stroke:var(--pin-dk)" stroke-width="0.6"/>
        <path d="M14,11 C15.6,15 16,19.5 12.6,24.6 L27.4,24.6 C24,19.5 24.4,15 26,11 Z" fill="url(#pg)"/>
        <ellipse cx="20" cy="10.5" rx="9.2" ry="4.4" fill="url(#pg)" style="stroke:var(--pin-dk)" stroke-width="0.6"/>
        <path d="M13.5,9.2 Q16.5,7.3 20.5,7.7" stroke="#fff" stroke-opacity="0.75" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <path d="M12.6,25.8 Q16.5,24.2 20.6,24.7" stroke="#fff" stroke-opacity="0.55" stroke-width="1" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
    <button id="close" title="关闭 (Esc)">✕</button>
    <button class="pbtn" id="annBtn" title="标注这张图">✎ 标注</button>
    <button class="pbtn" id="ocrBtn" title="识别图中文字">文 识别</button>
    <button class="pbtn on" id="topBtn">置顶</button>
    <div id="hint">滚轮缩放 · 可拖动</div>
  </div>
<script src="pinwin.js"></script>
<script>
  const T = window.__TAURI__;
  const img = document.getElementById("img");
  const errBox = document.getElementById("err");
  const showErr = (m) => { errBox.textContent = m; errBox.style.display = "flex"; };

  function win() { try { return T.window.getCurrentWindow(); } catch (e) { return null; } }
  let natW = 480, natH = 360, scale = 1, restored = false;

  function applySize() {
    try {
      const LogicalSize = T.window.LogicalSize;
      const w = Math.max(160, Math.round(natW * scale));
      const h = Math.max(120, Math.round(natH * scale));
      const wnd = win();
      if (wnd && LogicalSize) wnd.setSize(new LogicalSize(w + 12, h + 26));
    } catch (e) {}
  }

  img.onload = () => {
    natW = img.naturalWidth || natW;
    natH = img.naturalHeight || natH;
    if (restored) { // keep the size it was left at; wheel zoom goes on from there
      scale = Math.max(0.15, Math.min(6, (window.innerWidth - 12) / natW));
      return;
    }
    scale = Math.min(1, 900 / natW, 680 / natH);
    applySize();
  };
  img.onerror = () => showErr("图片无法显示：" + path);

  let path = "";
  (async () => {
    try {
      const label = win() ? win().label : "";
      path = await T.core.invoke("get_pin_path", { label });
    } catch (e) { showErr("无法获取路径：" + e); return; }
    if (!path) { showErr("未提供图片路径"); return; }
    const spec = await PW.spec();
    restored = !!spec.restored; delete spec.restored;
    PW.hello(spec); drawTop();
    try {
      img.src = await T.core.invoke("read_image_data", { path });
    } catch (e) {
      showErr("读取失败：" + (e && e.toString ? e.toString() : e) + "\n" + path);
    }
  })();

  const PIN_COLORS = {
    soft: ["#e2604a", "#f6b3a6", "#a93b2a"],
    silver: ["#8fa0b3", "#e3e9f0", "#5d6b7b"],
    linen: ["#c99a5b", "#f0d9b4", "#8c6633"],
    porcelain: ["#efece6", "#ffffff", "#b3aea5"],
    graphite: ["#4b5059", "#9aa0aa", "#24272d"],
  };
  (async () => {
    try {
      const cfg = JSON.parse(await T.core.invoke("get_settings") || "{}");
      const c = PIN_COLORS[cfg.theme] || PIN_COLORS.soft;
      const pin = document.getElementById("pin");
      pin.style.setProperty("--pin-base", c[0]); pin.style.setProperty("--pin-hi", c[1]); pin.style.setProperty("--pin-dk", c[2]);
    } catch (e) {}
  })();

  document.getElementById("annBtn").addEventListener("click", (e) => { e.stopPropagation(); if (path) T.core.invoke("annotate_image", { path, w: null, h: null }).catch(() => {}); });
  document.getElementById("ocrBtn").addEventListener("click", (e) => { e.stopPropagation(); if (path) T.core.invoke("ocr_to_line", { path }).catch(() => {}); });
  const topBtn = document.getElementById("topBtn");
  function drawTop() {
    topBtn.classList.toggle("on", PW.top);
    topBtn.title = PW.top ? "已置顶：点一下取消，可被其他窗口盖住" : "没有置顶：点一下让它总在最上面";
  }
  topBtn.addEventListener("click", async (e) => { e.stopPropagation(); await PW.setTop(!PW.top); drawTop(); });
  ["annBtn", "ocrBtn", "topBtn"].forEach((id) => document.getElementById(id).addEventListener("mousedown", (e) => e.stopPropagation()));
  function closeSelf() { PW.close(); }
  document.getElementById("close").addEventListener("click", (e) => { e.stopPropagation(); closeSelf(); });
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") closeSelf(); });
  window.addEventListener("wheel", (e) => {
    e.preventDefault();
    scale *= e.deltaY < 0 ? 1.12 : 1 / 1.12;
    scale = Math.max(0.15, Math.min(6, scale));
    applySize();
  }, { passive: false });
</script>
</body>
</html>
