[package]
name = "clipline"
version = "1.0.0"
description = "ClipLine — a clothesline-themed clipboard manager and sticky-notes line"
authors = ["ClipLine"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-drag = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"

# Windows-only native bits: real clipboard access (incl. images), cursor
# polling for the top-edge "drop", and paste-into-the-previous-app.
# Excluded on other platforms so the project still type-checks on Linux.
[target.'cfg(windows)'.dependencies]
arboard = "3"
clipboard-win = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
base64 = "0.22"
enigo = "0.2"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
codegen-units = 1
