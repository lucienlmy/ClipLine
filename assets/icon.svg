<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f6f2"/>
      <stop offset="1" stop-color="#ece9e2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1efe8"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- rounded tile -->
  <rect x="26" y="26" width="460" height="460" rx="104" fill="url(#bg)"/>
  <rect x="26" y="26" width="460" height="460" rx="104" fill="none" stroke="#dcd8ce" stroke-width="3"/>

  <!-- the line, sagging gently -->
  <path d="M 70 150 Q 256 196 442 150" fill="none" stroke="#c9b79a" stroke-width="10" stroke-linecap="round"/>

  <!-- a clay note hanging on the line -->
  <g filter="url(#sh)" transform="rotate(-6 196 300)">
    <rect x="128" y="176" width="150" height="196" rx="14" fill="#e3b7a3"/>
    <rect x="128" y="176" width="150" height="196" rx="14" fill="none" stroke="#d2a28c" stroke-width="2"/>
    <line x1="150" y1="226" x2="256" y2="226" stroke="#b9826a" stroke-width="7" stroke-linecap="round"/>
    <line x1="150" y1="262" x2="256" y2="262" stroke="#c89683" stroke-width="7" stroke-linecap="round"/>
    <line x1="150" y1="298" x2="222" y2="298" stroke="#c89683" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- a white clip card behind-right -->
  <g filter="url(#sh)" transform="rotate(5 330 300)">
    <rect x="266" y="190" width="150" height="190" rx="14" fill="url(#card)"/>
    <rect x="266" y="190" width="150" height="190" rx="14" fill="none" stroke="#e0ddd4" stroke-width="2"/>
    <line x1="288" y1="238" x2="394" y2="238" stroke="#cfcabf" stroke-width="7" stroke-linecap="round"/>
    <line x1="288" y1="274" x2="394" y2="274" stroke="#dcd8cd" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- clothespins -->
  <g fill="#d97757">
    <rect x="186" y="150" width="20" height="54" rx="8"/>
  </g>
  <g fill="#c7925f">
    <rect x="322" y="156" width="20" height="54" rx="8"/>
  </g>
</svg>
